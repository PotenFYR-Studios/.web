  </defs>

  <!-- Background Hexagon Badge -->
  <circle cx="64" cy="64" r="58" fill="url(#shield-grad)" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="64" cy="64" r="50" fill="url(#hq-glow)" opacity="0.3"/>


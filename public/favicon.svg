  <circle cx="64" cy="64" r="34" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Futuristic P Letterform -->
  <path d="M48 34 H72 C83 34 90 41 90 52 C90 63 83 70 72 70 H58 V94 H48 V34 Z M58 44 V60 H71 C76.5 60 80 57 80 52 C80 47 76.5 44 71 44 H58 Z" fill="url(#cyber-grad)"/>

  <!-- Cyber Accents -->
  <circle cx="64" cy="18" r="3" fill="#22d3ee"/>
  <circle cx="110" cy="64" r="3" fill="#3b82f6"/>
  <circle cx="64" cy="110" r="3" fill="#22d3ee"/>
  <circle cx="18" cy="64" r="3" fill="#3b82f6"/>
</svg>
